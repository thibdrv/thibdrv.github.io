  <!-- code -->
  <g class="mono">
    <text x="246" y="124"><tspan class="c">// Astronomy Quiz</tspan></text>
    <text x="246" y="138"><tspan class="k">const</tspan> <tspan class="v">questions</tspan> = <tspan class="p">await</tspan> <tspan class="f">fetch</tspan>(<tspan class="s">"/api/quiz"</tspan>);</text>
    <text x="246" y="152"><tspan class="k">let</tspan> <tspan class="v">score</tspan> = <tspan class="n">0</tspan>;</text>
    <text x="246" y="180"><tspan class="k">function</tspan> <tspan class="f">render</tspan>(<tspan class="v">q</tspan>) {</text>
    <text x="246" y="194">  <tspan class="v">title</tspan>.<tspan class="v">textContent</tspan> = <tspan class="v">q</tspan>.<tspan class="v">text</tspan>;</text>
    <text x="246" y="208">  <tspan class="v">q</tspan>.<tspan class="v">options</tspan>.<tspan class="f">forEach</tspan>((<tspan class="v">opt</tspan>, <tspan class="v">i</tspan>) <tspan class="k">=&gt;</tspan> {</text>
    <text x="246" y="222">    <tspan class="k">const</tspan> <tspan class="v">btn</tspan> = <tspan class="v">document</tspan>.<tspan class="f">createElement</tspan>(<tspan class="s">"button"</tspan>);</text>
    <text x="246" y="236">    <tspan class="v">btn</tspan>.<tspan class="f">onclick</tspan> = () <tspan class="k">=&gt;</tspan> <tspan class="f">check</tspan>(<tspan class="v">i</tspan>, <tspan class="v">q</tspan>.<tspan class="v">answer</tspan>);</text>
    <text x="246" y="250">    <tspan class="v">list</tspan>.<tspan class="f">append</tspan>(<tspan class="v">btn</tspan>);</text>
    <text x="246" y="264">  });</text>
    <text x="246" y="278">}</text>
    <text x="246" y="306"><tspan class="k">async function</tspan> <tspan class="f">check</tspan>(<tspan class="v">i</tspan>, <tspan class="v">answer</tspan>) {</text>
    <text x="246" y="320">  <tspan class="p">if</tspan> (<tspan class="v">i</tspan> === <tspan class="v">answer</tspan>) <tspan class="v">score</tspan>++;</text>
    <text x="246" y="334">  <tspan class="f">next</tspan>();</text>
  </g>
