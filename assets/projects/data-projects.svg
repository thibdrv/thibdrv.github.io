<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" role="img" aria-label="Data workstation: real-time dashboard and scraping terminal">
  <defs>
    <style>
      .ui { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: Consolas, "SFMono-Regular", "Cascadia Mono", Menlo, "Courier New", monospace; font-size: 8.6px; }
    </style>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23272b"/><stop offset="1" stop-color="#111315"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7ab8ff" stop-opacity="0.22"/><stop offset="1" stop-color="#7ab8ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34302c"/><stop offset="1" stop-color="#14120f"/></linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2d30"/><stop offset="1" stop-color="#0d0e0f"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2b2e31"/><stop offset="0.5" stop-color="#5a5e62"/><stop offset="1" stop-color="#26292c"/></linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b4f53"/><stop offset="1" stop-color="#1f2123"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#01B8AA" stop-opacity="0.32"/><stop offset="1" stop-color="#01B8AA" stop-opacity="0"/></linearGradient>
  </defs>

  <!-- décor -->
  <rect width="800" height="600" fill="url(#wall)"/>
  <ellipse cx="315" cy="235" rx="360" ry="250" fill="url(#glow)"/>
  <rect y="480" width="800" height="120" fill="url(#desk)"/>
  <path d="M0 480 H800" stroke="#fff" stroke-opacity="0.1"/>

  <!-- ===== moniteur ===== -->
  <ellipse cx="316" cy="486" rx="150" ry="6" fill="#000" fill-opacity="0.45"/>
  <rect x="288" y="392" width="54" height="78" fill="url(#metal)"/>
  <rect x="228" y="466" width="174" height="14" rx="6" fill="url(#base)"/>
  <rect x="68" y="62" width="494" height="334" rx="11" fill="url(#bezel)"/>
  <rect x="68" y="62" width="494" height="334" rx="11" stroke="#fff" stroke-opacity="0.1"/>
  <circle cx="315" cy="385" r="2" fill="#6f7377"/>

  <!-- écran -->
  <rect x="80" y="74" width="470" height="302" fill="#edebe9"/>
  <!-- barre du haut -->
  <rect x="80" y="74" width="470" height="26" fill="#252423"/>
  <rect x="88" y="80" width="14" height="14" fill="#F2C811"/>
  <path d="M91 91 V86 M95 91 V83 M99 91 V88" stroke="#252423" stroke-width="2"/>
  <text class="ui" x="110" y="91" font-size="9.5" font-weight="600" fill="#fff" fill-opacity="0.92">Market Intelligence</text>
  <circle cx="509" cy="87" r="3.6" fill="#ff4d4d"/>
  <text class="ui" x="546" y="91" font-size="8.5" font-weight="700" fill="#fff" text-anchor="end" letter-spacing="0.6">LIVE</text>

  <!-- cartes KPI -->
  <g class="ui">
    <rect x="88"  y="108" width="108" height="50" fill="#fff" stroke="#dcdad8"/>
    <text x="96"  y="122" font-size="7" fill="#605e5c" letter-spacing="0.6">LISTINGS</text>
    <text x="96"  y="145" font-size="16" font-weight="700" fill="#252423">1,284</text>
    <text x="188" y="145" font-size="8.5" font-weight="700" fill="#16a34a" text-anchor="end">+4.1%</text>

    <rect x="203" y="108" width="108" height="50" fill="#fff" stroke="#dcdad8"/>
    <text x="211" y="122" font-size="7" fill="#605e5c" letter-spacing="0.6">AVG PRICE</text>
    <text x="211" y="145" font-size="16" font-weight="700" fill="#252423">€2,430</text>
    <text x="303" y="145" font-size="8.5" font-weight="700" fill="#16a34a" text-anchor="end">+2.4%</text>

    <rect x="318" y="108" width="108" height="50" fill="#fff" stroke="#dcdad8"/>
    <text x="326" y="122" font-size="7" fill="#605e5c" letter-spacing="0.6">SALES VOL.</text>
    <text x="326" y="145" font-size="16" font-weight="700" fill="#252423">312</text>
    <text x="418" y="145" font-size="8.5" font-weight="700" fill="#dc2626" text-anchor="end">-1.8%</text>

    <rect x="433" y="108" width="108" height="50" fill="#fff" stroke="#dcdad8"/>
    <text x="441" y="122" font-size="7" fill="#605e5c" letter-spacing="0.6">YIELD</text>
    <text x="441" y="145" font-size="16" font-weight="700" fill="#252423">6.2%</text>
    <text x="533" y="145" font-size="8.5" font-weight="700" fill="#16a34a" text-anchor="end">+0.4</text>
  </g>

  <!-- histogramme -->
  <rect x="88" y="166" width="222" height="134" fill="#fff" stroke="#dcdad8"/>
  <text class="ui" x="96" y="180" font-size="8" font-weight="600" fill="#252423">Price by district</text>
  <g stroke="#e1dfdd"><path d="M98 232 H300 M98 260 H300"/></g>
  <path d="M98 288 H300" stroke="#c8c6c4"/>
  <g fill="#01B8AA">
    <rect x="104" y="248" width="18" height="40"/><rect x="132" y="226" width="18" height="62"/><rect x="160" y="238" width="18" height="50"/>
    <rect x="188" y="204" width="18" height="84"/><rect x="216" y="218" width="18" height="70"/>
    <rect x="244" y="192" width="18" height="96" fill="#F2C811"/><rect x="272" y="210" width="18" height="78"/>
  </g>

  <!-- courbe temps réel -->
  <rect x="318" y="166" width="224" height="134" fill="#fff" stroke="#dcdad8"/>
  <text class="ui" x="326" y="180" font-size="8" font-weight="600" fill="#252423">Price trend · real time</text>
  <g stroke="#e1dfdd"><path d="M328 232 H532 M328 260 H532"/></g>
  <path d="M328 288 H532" stroke="#c8c6c4"/>
  <path d="M332 276 L362 266 L392 270 L422 248 L452 254 L482 226 L512 214 L530 200 V288 H332 Z" fill="url(#area)"/>
  <polyline points="332,282 362,278 392,274 422,268 452,262 482,256 512,250 530,244" stroke="#374649" stroke-width="1.4" stroke-dasharray="4 3"/>
  <polyline points="332,276 362,266 392,270 422,248 452,254 482,226 512,214 530,200" stroke="#01B8AA" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="530" cy="200" r="4.2" fill="#01B8AA" stroke="#fff" stroke-width="1.6"/>

  <!-- ligne du bas : anneau + barres -->
  <rect x="88" y="308" width="150" height="62" fill="#fff" stroke="#dcdad8"/>
  <g transform="rotate(-90 124 339)" stroke-width="10">
    <circle cx="124" cy="339" r="18" stroke="#01B8AA" stroke-dasharray="62 51"/>
    <circle cx="124" cy="339" r="18" stroke="#F2C811" stroke-dasharray="28 85" stroke-dashoffset="-62"/>
    <circle cx="124" cy="339" r="18" stroke="#374649" stroke-dasharray="23 90" stroke-dashoffset="-90"/>
  </g>
  <g fill="#605e5c" fill-opacity="0.55"><rect x="156" y="324" width="70" height="4"/><rect x="156" y="338" width="54" height="4"/><rect x="156" y="352" width="62" height="4"/></g>
  <g fill="#01B8AA"><rect x="148" y="324" width="4" height="4"/></g><rect x="148" y="338" width="4" height="4" fill="#F2C811"/><rect x="148" y="352" width="4" height="4" fill="#374649"/>

  <rect x="246" y="308" width="296" height="62" fill="#fff" stroke="#dcdad8"/>
  <g fill="#605e5c" fill-opacity="0.5">
    <rect x="256" y="318" width="30" height="4"/><rect x="256" y="331" width="26" height="4"/><rect x="256" y="344" width="34" height="4"/><rect x="256" y="357" width="22" height="4"/>
  </g>
  <rect x="298" y="316" width="220" height="8" fill="#01B8AA"/>
  <rect x="298" y="329" width="178" height="8" fill="#01B8AA" fill-opacity="0.85"/>
  <rect x="298" y="342" width="140" height="8" fill="#F2C811"/>
  <rect x="298" y="355" width="96" height="8" fill="#01B8AA" fill-opacity="0.7"/>

  <!-- reflet -->
  <path d="M80 74 H292 L176 376 H80 Z" fill="#fff" fill-opacity="0.07"/>

  <!-- ===== portable : scraping en direct ===== -->
  <ellipse cx="672" cy="486" rx="116" ry="5" fill="#000" fill-opacity="0.5"/>
  <rect x="586" y="330" width="172" height="140" rx="8" fill="#17191b" stroke="#34383c"/>
  <rect x="594" y="338" width="156" height="124" fill="#0a0d0f"/>
  <g class="mono">
    <text x="602" y="354" fill="#f4f3ef"><tspan fill="#46d369">$</tspan> scrape --live</text>
    <text x="602" y="368" fill="#f4f3ef" fill-opacity="0.65">GET /listings  200 OK</text>
    <text x="602" y="382" fill="#f4f3ef" fill-opacity="0.65">parsed 1,284 rows</text>
    <text x="602" y="396" fill="#46d369">avg_price  +2.4%</text>
    <text x="602" y="410" fill="#F2C811">claude: analysis ready</text>
    <text x="602" y="424" fill="#01B8AA">power bi: synced</text>
    <text x="602" y="440" fill="#f4f3ef"><tspan fill="#46d369">$</tspan></text>
  </g>
  <rect x="613" y="431" width="6" height="11" fill="#f4f3ef"/>
  <rect x="568" y="470" width="208" height="10" rx="3" fill="url(#base)"/>
  <rect x="650" y="470" width="44" height="3" rx="1.5" fill="#0b0b0b" fill-opacity="0.6"/>
</svg>
