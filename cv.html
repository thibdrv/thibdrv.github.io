      <h2>Thibaud Derville</h2>
      <p>Web Developer &amp; Data Analyst</p>
      <h3>Profile</h3>
      <p>Web developer and data analyst with hands-on experience in PHP, JavaScript, HTML5/CSS3, SQL, Python and Power BI. Designs clean, layered architectures and well-structured relational databases, and turns raw datasets into actionable insights through reports and dashboards. Six years of military leadership bring discipline, reliability and teamwork.</p>
      <h3>Employment history</h3>
      <ul class="nojs-list">
        <li>
          <h3>Data Analyst Intern, Synapse Learners, Sharjah, UAE</h3>
          <p>July 2026 – September 2026</p>
          <ul>
            <li>Gathered KPI requirements directly with clients and turned them into Power BI reports and dashboards (DAX measures) that gave clear visibility into business performance.</li>
            <li>Cleaned, transformed and analysed raw datasets with Python (Pandas) and SQL to produce insights for cross-functional decisions.</li>
            <li>Presented results to clients and refined reports based on their feedback.</li>
          </ul>
        </li>
        <li>
          <h3>Web Developer Intern, HG Développement, Rouen, France</h3>
          <p>June 2025 – November 2025</p>
          <ul>
            <li>Developed a full-stack web application with PHP, JavaScript, HTML5 and CSS3.</li>
            <li>Designed a multi-tier (layered) architecture to separate core responsibilities and keep the codebase maintainable.</li>
            <li>Designed and structured relational MySQL databases from scratch, creating optimised schemas that guarantee data integrity.</li>
            <li>Produced comprehensive technical documentation upon project completion to facilitate maintenance and smooth handover.</li>
          </ul>
        </li>
        <li>
          <h3>Team Leader, 3rd Marine Infantry Parachute Regiment (French Army), Carcassonne, France</h3>
          <p>June 2018 – June 2024</p>
          <ul>
            <li>Led a team of 3 soldiers on operational deployments in Africa and French overseas territories.</li>
            <li>Organised the team’s missions, equipment and safety in fast-changing environments.</li>
            <li>Reported clearly and accurately to command ; quickly mastered new procedures, protocols and technical equipment.</li>
          </ul>
        </li>
      </ul>
      <h3>Education</h3>
      <ul>
        <li>Bachelor Degree, Data Analyst (2026), Simplon, Paris, France</li>
        <li>Associate Degree, Web Developer (2025), HTSA, Toulouse, France</li>
      </ul>
      <h3>Technical skills</h3>
      <ul>
        <li>Data &amp; BI : Power BI, DAX, Excel, data cleaning, data visualisation</li>
        <li>Programming : Python (Pandas, NumPy, Matplotlib, Seaborn, Scikit-learn), SQL, web scraping</li>
        <li>Web development : PHP, JavaScript, HTML5, CSS3</li>
        <li>Back-end &amp; architecture : Multi-tier (layered) architecture, full-stack development, technical documentation</li>
        <li>Databases : MySQL, MariaDB, relational schema design</li>
        <li>Security &amp; compliance : Web security, GDPR (data protection)</li>
        <li>AI tools : Claude Code, Ollama (local LLMs)</li>
        <li>Tools : Git, GitHub, VS Code, Jupyter Notebook, Anaconda, Google Colab, Microsoft 365</li>
      </ul>
      <h3>Languages</h3>

        <li>French : Native</li>
        <li>English : C1</li>
